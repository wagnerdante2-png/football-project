name: Enable Real World Default

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enable-real-world-default.mjs'
      - '.github/workflows/enable-real-world-default.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/enable-real-world-default.mjs
      - run: npm install
      - run: npm run build
      - name: Publish bootstrap switch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.ts
          if git diff --cached --quiet; then
            echo 'Already enabled.'
          else
            git commit -m 'feat: make real Brazilian world the default career'
            git push
          fi
