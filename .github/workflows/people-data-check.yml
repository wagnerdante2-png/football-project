name: People Data Check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-people-2026.mjs'
      - 'scripts/validate-people-2026.mjs'
      - 'src/openfootball-people-source-v1.ts'
      - 'src/real-world-2026-loader-v1.ts'
      - 'public/data/openfootball-global/**'
      - '.github/workflows/people-data-check.yml'
  workflow_dispatch:

concurrency:
  group: people-data-main
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify-people-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Generate licensed global 2026 people assets
        run: npm run sync:people
      - name: Validate generated assets
        run: npm run validate:people
      - name: Publish validated offline people bundle
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/people
          if git diff --cached --quiet; then echo 'People bundle unchanged.'; exit 0; fi
          git commit -m 'data: refresh global licensed people bundle'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
