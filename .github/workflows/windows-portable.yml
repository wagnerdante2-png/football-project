name: Windows Portable Beta

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-beta-manual
  cancel-in-progress: true

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install project dependencies
        run: npm install

      - name: Bundle verified visual assets for offline desktop
        run: node scripts/bundle-portable-visual-assets.mjs

      - name: Build web application
        run: npm run build

      - name: Install desktop packager
        run: npm install --no-save electron@latest electron-builder@latest

      - name: Build portable EXE
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload portable beta
        uses: actions/upload-artifact@v4
        with:
          name: The-Touchline-Beta-Windows-Portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 3
