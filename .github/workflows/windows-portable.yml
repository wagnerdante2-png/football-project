name: Windows Portable Beta

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/portable-demo-trigger"

permissions:
  contents: read

concurrency:
  group: windows-portable-beta-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  portable:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install project dependencies
        run: npm install

      - name: Bundle verified visual assets for offline desktop
        run: node scripts/bundle-portable-visual-assets.mjs

      - name: Build web application
        run: npm run build

      - name: Install desktop packager
        run: npm install --no-save electron@latest electron-builder@latest

      - name: Build portable EXE
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload portable beta
        uses: actions/upload-artifact@v4
        with:
          name: The-Touchline-Beta-Windows-Portable
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
