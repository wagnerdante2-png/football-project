name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run build
      - name: Profile daily simulation subsystems
        run: npx tsx scripts/profile-daily-subsystems.ts
      - name: Smoke daily simulation runtime
        run: npm run smoke:advance
