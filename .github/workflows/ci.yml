name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Full beta gate: engine/data smoke tests plus browser stress and UI lifecycle coverage.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run build
      - name: Audit active module coverage
        run: npm run audit:coverage
      - name: Smoke daily simulation runtime
        run: npm run smoke:advance
      - name: Smoke completed season lifecycle
        run: npm run smoke:season
      - name: Smoke match weather and tactical learning
        run: npm run smoke:match
      - name: Smoke isolated match context
        run: npm run smoke:context
      - name: Profile active match distribution
        run: npm run profile:match
      - name: Smoke safe world football foundation
        run: npm run smoke:foundation
      - name: Smoke world population identity integrity
        run: npm run smoke:population
      - name: Smoke scouting to recruitment bridge
        run: npm run smoke:scouting-recruitment
      - name: Smoke world background club integration
        run: npm run smoke:background-club
      - name: Smoke persistent human dialogue and voice identity
        run: npm run smoke:human-dialogue
      - name: Smoke human press conference and reporter follow-ups
        run: npm run smoke:human-press
      - name: Smoke team talks, meetings, repetition and save
        run: npm run smoke:team-talks
      - name: Validate bundled people when present
        run: |
          if [ -f public/data/people/manifest-2026.json ]; then npm run validate:people; else echo 'People bundle pending data workflow publication.'; fi
      - name: Load full licensed offline people bundle
        run: npm run smoke:people-bundle
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run preview -- --port 4173 > /tmp/touchline-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/touchline-preview.log
          exit 1
      - name: Stress beta end to end
        run: npm run test:e2e:stress
      - name: UI lifecycle bridge decorators
        run: npm run test:e2e:ui-bridge
