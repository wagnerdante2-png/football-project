name: Roster Data Sync

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Visual Assets Check']
    types: [completed]
  schedule:
    - cron: '17 6 * * 0'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-wikidata-rosters-2026.mjs'
      - 'scripts/sync-people-2026.mjs'
      - '.github/workflows/roster-data-sync.yml'

concurrency:
  group: football-roster-data-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build licensed player identity index
        run: npm run sync:people
      - name: Resolve verified club rosters
        run: npm run sync:rosters
      - name: Validate roster artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const br=JSON.parse(await fs.readFile('public/data/rosters/brazil-serie-a-2026.json','utf8'));
          if(br.source?.license!=='CC0') throw new Error('Brazil roster source must remain CC0');
          if(!Array.isArray(br.rosters)||!br.rosters.length) throw new Error('no Brazilian club rosters resolved');
          for(const club of br.rosters) for(const p of club.players??[]){
            if(!p.wikidataId||!p.name||p.clubId!==club.id) throw new Error(`invalid player membership in ${club.name}`);
            if(p.provenance?.clubStatement!=='P54') throw new Error(`unverified membership ${p.name}`);
            if((p.positionSource?.startsWith('OpenFootball')||p.roleGroupSource?.startsWith('OpenFootball'))&&!p.dateOfBirth) throw new Error(`OpenFootball join without DOB: ${p.name}`);
          }
          const world=JSON.parse(await fs.readFile('public/data/rosters/world-tier-a-2026.json','utf8'));
          if(world.tier!=='A'||world.version<1) throw new Error('invalid world Tier A roster snapshot');
          if(!world.sources?.some(s=>s.name==='Wikidata'&&s.license==='CC0')) throw new Error('Tier A Wikidata source must remain CC0');
          if(!world.sources?.some(s=>s.name==='OpenFootball clubs'&&s.license==='CC0-1.0')) throw new Error('Tier A club registry must remain CC0-1.0');
          if((world.counts?.countriesResolved??0)<5) throw new Error(`too few Tier A countries resolved: ${world.counts?.countriesResolved}`);
          if((world.counts?.clubs??0)<20||(world.counts?.players??0)<100) throw new Error(`Tier A roster coverage too small: clubs=${world.counts?.clubs} players=${world.counts?.players}`);
          const ids=new Set();for(const p of world.players??[]){if(!p.wikidataId||!p.name||!p.clubName) throw new Error('invalid Tier A player membership');if(p.provenance?.clubStatement!=='P54') throw new Error(`unverified Tier A membership ${p.name}`);if(ids.has(p.wikidataId))throw new Error(`duplicate Tier A player ${p.wikidataId}`);ids.add(p.wikidataId)}
          console.log({brazil:br.counts,tierA:world.counts});
          NODE
      - name: Publish verified roster snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/rosters/brazil-serie-a-2026.json public/data/rosters/world-tier-a-2026.json
          if git diff --cached --quiet; then
            echo 'Roster snapshots unchanged.'
          else
            git commit -m 'data: refresh verified world rosters 2026'
            # sync:people intentionally regenerates additional local artifacts. They are
            # inputs/cache for this job, not part of the roster snapshot publication.
            # Drop those residual worktree changes so rebase can operate on a clean tree.
            git reset --hard HEAD
            git clean -fd
            for attempt in 1 2 3; do
              if ! git pull --rebase origin main; then
                echo "Rebase race on attempt ${attempt}; aborting and retrying."
                git rebase --abort || true
                sleep $((attempt * 2))
                continue
              fi
              if git push origin HEAD:main; then exit 0; fi
              echo "Push race on attempt ${attempt}; retrying."
              sleep $((attempt * 2))
            done
            exit 1
          fi
