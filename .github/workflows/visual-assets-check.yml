name: Visual Assets Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-visual-assets-2026.mjs'
      - 'src/visual-identity-v1.ts'
      - 'src/visual-bootstrap-v1.ts'
      - 'src/visual-identity-v1.css'
      - 'package.json'
      - '.github/workflows/visual-assets-check.yml'

permissions:
  contents: write

jobs:
  verify-visual-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VISUAL_CLUB_LIMIT: 20
      VISUAL_PLAYER_LIMIT: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate licensed people targets
        run: npm run sync:people
      - name: Resolve licensed visual assets
        run: npm run sync:visual
      - name: Validate visual manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const m=JSON.parse(await fs.readFile('public/data/visual/visual-assets-2026.json','utf8'));
          if(!m.version||!Array.isArray(m.clubs)||!Array.isArray(m.players)) throw new Error('invalid manifest');
          if(m.clubs.length<20) throw new Error('full Serie A identity target was not produced');
          for(const group of [m.clubs,m.players]) for(const row of group) for(const key of ['crest','stadiumImage','portrait']){
            const a=row[key]; if(!a) continue;
            if(!['CC0','CC BY','CC BY-SA','Public domain'].includes(a.license)) throw new Error(`non-free asset leaked: ${row.name} ${a.license}`);
            if(!a.freeToRedistribute) throw new Error(`asset not marked redistributable: ${row.name}`);
          }
          console.log(m.counts);
          NODE
      - name: Publish verified manifest
        if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/visual/visual-assets-2026.json
          if git diff --cached --quiet; then
            echo 'Visual manifest unchanged.'
          else
            git commit -m 'data: refresh verified visual assets 2026'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: visual-assets-2026
          path: public/data/visual/visual-assets-2026.json
